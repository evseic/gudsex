<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>gudsex ✦ coming soon</title>
  
  <!-- Meta & Favicon Icons -->
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="apple-touch-icon" href="public/favicon.svg">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="gudsex ✦ coming soon">
  <meta property="og:description" content="gudsex official clothing brand. subscribe to news for priority access.">
  <meta property="og:image" content="public/hero.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons & Canvas Confetti CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-black: #000000;
      --text-primary: #ffffff;
      --font-heading: 'Syne', sans-serif;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    ::selection {
      background: #ffffff;
      color: #000000;
    }

    /* Noise overlay */
    .noise-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 99;
    }

    /* Background Photo */
    .hero-photo-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
    }

    .hero-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: contrast(106%) brightness(88%) grayscale(10%);
      transform: scale(1.02);
      transition: filter 0.8s ease, transform 10s ease, object-position 0.5s ease;
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.85) 85%, rgba(0,0,0,0.95) 100%),
        radial-gradient(circle at 30% 30%, transparent 30%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* FULL PHOTO MODE OVERRIDES */
    .full-photo-active .hero-vignette,
    .full-photo-active .site-header,
    .full-photo-active .stage-container,
    .full-photo-active .footer-bar {
      opacity: 0;
      pointer-events: none;
    }

    .full-photo-active .hero-photo {
      filter: contrast(100%) brightness(100%) grayscale(0%) !important;
      transform: scale(1) !important;
    }

    /* Header */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 1.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.4s ease, padding 0.3s ease;
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 4.5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: lowercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }

    .brand-star {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #ffffff;
      animation: starPulse 3s infinite ease-in-out;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      50% { transform: scale(1.25) rotate(90deg); opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.9); }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: clamp(0.65rem, 1.8vw, 0.75rem);
      letter-spacing: 0.1em;
      padding: 0.55rem 0.95rem;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(16px);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .btn-glass:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .btn-glass.audio-active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    .exit-photo-btn {
      position: fixed;
      bottom: 2.5rem;
      right: 2.5rem;
      z-index: 100;
      display: none;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 0.85rem 1.75rem;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      transition: all 0.25s ease;
    }

    .exit-photo-btn:hover {
      background: #e2e2e2;
      transform: translateY(-2px);
    }

    .full-photo-active .exit-photo-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* Stage */
    .stage-container {
      position: relative;
      z-index: 10;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 2rem 1.5rem 5.5rem 1.5rem;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    .content-box {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Animated Coming Soon Title */
    .coming-soon-title {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 4.5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 0.75rem;
      animation: comingSoonPulse 4s infinite ease-in-out;
      display: inline-block;
      white-space: nowrap;
    }

    @keyframes comingSoonPulse {
      0%, 100% {
        opacity: 0.9;
        letter-spacing: 0.18em;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.3);
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        letter-spacing: 0.24em;
        text-shadow: 0 0 35px rgba(255, 255, 255, 0.9), 0 0 12px rgba(255, 255, 255, 0.6);
        transform: translateY(-3px);
      }
    }

    .subscribe-label {
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    /* Form */
    .subscribe-form-box {
      background: rgba(8, 8, 8, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(24px);
      padding: 0.45rem;
      border-radius: 6px;
      width: 100%;
      display: flex;
      gap: 0.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .subscribe-form-box:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
    }

    .subscribe-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      padding: 0.75rem 0.9rem;
      outline: none;
      width: 100%;
    }

    .subscribe-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-submit {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 0.75rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .btn-submit:hover {
      background: #e2e2e2;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .success-msg {
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid #ffffff;
      backdrop-filter: blur(20px);
      padding: 1rem 1.5rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 2.2vw, 0.85rem);
      letter-spacing: 0.15em;
      color: #ffffff;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      display: none;
      width: 100%;
    }

    /* Footer */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: clamp(0.65rem, 1.8vw, 0.75rem);
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.15em;
      transition: opacity 0.4s ease;
    }

    .social-link {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      transition: color 0.2s ease, text-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .social-link:hover {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* MOBILE & TABLET MEDIA QUERIES */
    @media (max-width: 768px) {
      .hero-photo {
        object-position: 30% 35%;
        filter: contrast(108%) brightness(84%) grayscale(10%);
      }

      .site-header {
        padding: 1.25rem 1.25rem;
      }

      .stage-container {
        padding: 1.5rem 1.25rem 6.5rem 1.25rem;
      }

      .footer-bar {
        padding: 1.25rem;
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
      }

      .exit-photo-btn {
        bottom: 2rem;
        right: 50%;
        transform: translateX(50%);
        width: max-content;
        padding: 0.75rem 1.4rem;
      }
    }

    @media (max-width: 480px) {
      .hero-photo {
        object-position: 32% 38%;
      }

      .coming-soon-title {
        font-size: clamp(1.25rem, 5.5vw, 1.75rem);
        letter-spacing: 0.14em;
        white-space: nowrap;
      }

      .subscribe-form-box {
        flex-direction: column;
        padding: 0.6rem;
        gap: 0.6rem;
        background: rgba(0, 0, 0, 0.85);
      }
      
      .btn-submit {
        width: 100%;
        padding: 0.85rem;
      }

      .btn-glass {
        padding: 0.5rem 0.75rem;
      }
    }
  </style>
</head>
<body id="body">
  <div class="noise-overlay"></div>

  <!-- Background Photo -->
  <div class="hero-photo-container">
    <img src="public/hero.png" alt="Gudsex Photo" class="hero-photo">
    <div class="hero-vignette"></div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <a href="#" class="brand-logo">
      gudsex <span class="brand-star">✦</span>
    </a>

    <div class="header-controls">
      <!-- Trap Audio Button -->
      <button class="btn-glass" id="audioBtn" title="Toggle Audio" style="padding: 0.55rem 0.75rem;">
        <i data-lucide="volume-x"></i> <span id="audioTxt"></span>
      </button>

      <!-- Open Full Photo Button -->
      <button class="btn-glass" id="fullPhotoBtn" title="View Full Photo">
        <i data-lucide="maximize-2"></i> <span>Full Photo</span>
      </button>
    </div>
  </header>

  <!-- Exit Full Photo Button -->
  <button class="exit-photo-btn" id="exitPhotoBtn">
    <i data-lucide="minimize-2"></i> Exit Full Photo
  </button>

  <!-- Stage -->
  <main class="stage-container">
    <div class="content-box">
      <h1 class="coming-soon-title">✦ Coming Soon ✦</h1>
      
      <p class="subscribe-label">Subscribe to news</p>

      <form class="subscribe-form-box" id="subForm">
        <input type="email" required placeholder="ENTER YOUR EMAIL..." class="subscribe-input" id="emailInput">
        <button type="submit" class="btn-submit">Subscribe</button>
      </form>

      <div class="success-msg" id="successMsg">
        ✦ ACCESS GRANTED // YOU ARE SUBSCRIBED
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-bar">
    <span>© GUDSEX ✦ ALL RIGHTS RESERVED</span>
    <div>
      <a href="https://www.instagram.com/evseicik/" target="_blank" rel="noopener noreferrer" class="social-link">
        <i data-lucide="instagram" style="width: 14px; height: 14px;"></i> INSTAGRAM @EVSEICIK
      </a>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    const body = document.getElementById('body');
    const fullPhotoBtn = document.getElementById('fullPhotoBtn');
    const exitPhotoBtn = document.getElementById('exitPhotoBtn');

    fullPhotoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      body.classList.add('full-photo-active');
    });

    exitPhotoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      body.classList.remove('full-photo-active');
    });

    const subForm = document.getElementById('subForm');
    const successMsg = document.getElementById('successMsg');

    subForm.addEventListener('submit', (e) => {
      e.preventDefault();
      subForm.style.display = 'none';
      successMsg.style.display = 'block';

      if (window.confetti) {
        confetti({
          particleCount: 75,
          spread: 70,
          origin: { y: 0.7 },
          colors: ['#ffffff', '#aaaaaa', '#444444']
        });
      }
    });

    // Trap Audio Synth
    let audioCtx = null;
    const audioBtn = document.getElementById('audioBtn');

    function startSound() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return;
      }

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(43.65, audioCtx.currentTime);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(190, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();

        audioBtn.classList.add('audio-active');
        audioBtn.innerHTML = '<i data-lucide="volume-2"></i> <span style="font-size: 0.65rem;">ON</span>';
        lucide.createIcons();
      } catch (e) {
        console.log("Audio waiting for user tap");
      }
    }

    function stopSound() {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
        audioBtn.classList.remove('audio-active');
        audioBtn.innerHTML = '<i data-lucide="volume-x"></i>';
        lucide.createIcons();
      }
    }

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audioCtx) stopSound(); else startSound();
    });

    // Trigger sound on ANY tap/touch/click anywhere on the screen
    window.addEventListener('pointerdown', startSound, { capture: true });
    window.addEventListener('touchstart', startSound, { capture: true });
    window.addEventListener('click', startSound, { capture: true });
  </script>
</body>
</html>
